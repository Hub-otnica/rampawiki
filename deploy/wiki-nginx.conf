server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location ~ ^/(00_Zacetek|Delavnice|Koncepti|Materiali|Metode|Orodja|Projekti|Umetniki|Zemljevidi)/(00_Zacetek|Delavnice|Koncepti|Materiali|Metode|Orodja|Projekti|Umetniki|Zemljevidi)/(.*)$ {
    return 308 /$2/$3;
  }

  location /static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
